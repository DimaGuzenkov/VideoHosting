<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеосервис - Панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
<div class="container">
    <!-- Шапка -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-play-circle"></i> Видеосервис</h1>
        <div>
            <span id="userGreeting" class="me-3">Пользователь</span>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</button>
        </div>
    </div>

    <!-- Форма загрузки -->
    <div class="card mb-4">
        <div class="card-header"><i class="bi bi-cloud-upload"></i> Загрузить видео</div>
        <div class="card-body">
            <form id="uploadForm">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" id="uploadTitle" class="form-control" placeholder="Название">
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="uploadDescription" class="form-control" placeholder="Описание">
                    </div>
                    <div class="col-md-4">
                        <input type="file" id="uploadFile" class="form-control" accept="video/*">
                    </div>
                </div>
                <button type="button" onclick="uploadVideo()" class="btn btn-primary w-100 mt-3"><i class="bi bi-upload"></i> Загрузить</button>
                <progress id="uploadProgress" value="0" max="100" style="display:none; width:100%; margin-top:0.5rem;"></progress>
            </form>
            <div id="uploadStatus" class="mt-2 text-center"></div>
        </div>
    </div>

    <!-- Список видео -->
    <div class="card">
        <div class="card-header"><i class="bi bi-film"></i> Мои видео</div>
        <div class="card-body" id="videoList">
            <p class="text-muted">Загрузите видео, чтобы они появились здесь.</p>
        </div>
        <div id="videoListStatus" class="text-center pb-2"></div>
    </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
