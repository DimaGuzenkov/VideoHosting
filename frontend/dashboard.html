<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеосервис - Панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8f9fa; padding-top: 1rem; }
        .card { border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1); }
        .card-header { background: #0d6efd; color: white; border-radius: 1rem 1rem 0 0 !important; font-weight: 600; }
        .btn-primary { background: #0d6efd; border: none; }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-success { background: #198754; border: none; }
        .btn-success:hover { background: #157347; }
        .btn-danger { background: #dc3545; border: none; }
        .btn-danger:hover { background: #b02a37; }
        #videoList .video-item { border-bottom: 1px solid #dee2e6; padding: 0.75rem 0; }
        #videoList .video-item:last-child { border-bottom: none; }
        #uploadStatus, #videoListStatus { margin-top: 0.5rem; }
    </style>
</head>
<body>
<div class="container">
    <!-- Шапка -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-play-circle"></i> Видеосервис</h1>
        <div>
            <span id="userGreeting" class="me-3">Пользователь</span>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</button>
        </div>
    </div>

    <!-- Форма загрузки -->
    <div class="card mb-4">
        <div class="card-header"><i class="bi bi-cloud-upload"></i> Загрузить видео</div>
        <div class="card-body">
            <form id="uploadForm">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" id="uploadTitle" class="form-control" placeholder="Название">
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="uploadDescription" class="form-control" placeholder="Описание">
                    </div>
                    <div class="col-md-4">
                        <input type="file" id="uploadFile" class="form-control" accept="video/*">
                    </div>
                </div>
                <button type="button" onclick="uploadVideo()" class="btn btn-primary w-100 mt-3"><i class="bi bi-upload"></i> Загрузить</button>
            </form>
            <div id="uploadStatus" class="mt-2 text-center"></div>
        </div>
    </div>

    <!-- Список видео -->
    <div class="card">
        <div class="card-header"><i class="bi bi-film"></i> Мои видео</div>
        <div class="card-body" id="videoList">
            <p class="text-muted">Загрузите видео, чтобы они появились здесь.</p>
        </div>
        <div id="videoListStatus" class="text-center pb-2"></div>
    </div>
</div>

<script>
    function getToken() { return localStorage.getItem('jwt'); }
    function setToken(token) { localStorage.setItem('jwt', token); }
    function removeToken() { localStorage.removeItem('jwt'); }

    if (!getToken()) { window.location.href = '/login.html'; }

    async function loadVideoList() {
        const token = getToken();
        if (!token) return;
        const container = document.getElementById('videoList');
        const status = document.getElementById('videoListStatus');
        try {
            const res = await fetch('/api/videos', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!res.ok) {
                if (res.status === 403) { logout(); return; }
                status.textContent = 'Ошибка загрузки списка';
                return;
            }
            const videos = await res.json();
            if (videos.length === 0) {
                container.innerHTML = '<p class="text-muted">Нет загруженных видео.</p>';
            } else {
                container.innerHTML = videos.map(v => `
                    <div class="video-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${v.title}</strong>
                            <span class="badge bg-secondary ms-2">${v.status}</span>
                            ${v.status === 'READY' ? `<span class="badge bg-success ms-1"><i class="bi bi-check-circle"></i> готово</span>` : ''}
                        </div>
                        <div>
                            ${v.status === 'READY' ? `<a href="/player.html?id=${v.id}" class="btn btn-sm btn-success"><i class="bi bi-play"></i> Смотреть</a>` : ''}
                            <button onclick="deleteVideo(${v.id})" class="btn btn-sm btn-danger ms-1"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                `).join('');
            }
            status.textContent = '';
        } catch (e) {
            status.textContent = 'Ошибка: ' + e.message;
        }
    }

    async function uploadVideo() {
        const title = document.getElementById('uploadTitle').value.trim();
        const description = document.getElementById('uploadDescription').value.trim();
        const fileInput = document.getElementById('uploadFile');
        const file = fileInput.files[0];
        const status = document.getElementById('uploadStatus');
        if (!title || !file) { status.textContent = 'Заполните название и выберите файл.'; return; }
        const token = getToken();
        if (!token) { status.textContent = 'Нет токена.'; return; }
        const formData = new FormData();
        formData.append('file', file);
        formData.append('title', title);
        formData.append('description', description);
        try {
            const res = await fetch('/api/videos/upload', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: formData
            });
            const data = await res.json();
            if (res.ok) {
                status.textContent = '✅ Загружено! ID: ' + data.id;
                loadVideoList();
                document.getElementById('uploadTitle').value = '';
                document.getElementById('uploadDescription').value = '';
                document.getElementById('uploadFile').value = '';
            } else {
                status.textContent = '❌ Ошибка: ' + (data.error || JSON.stringify(data));
            }
        } catch (e) {
            status.textContent = '❌ Ошибка сети: ' + e.message;
        }
    }

    async function deleteVideo(videoId) {
        if (!confirm('Удалить видео?')) return;
        const token = getToken();
        try {
            const res = await fetch('/api/videos/' + videoId, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                loadVideoList();
            } else {
                const data = await res.json();
                alert('Ошибка удаления: ' + (data.error || res.status));
            }
        } catch (e) {
            alert('Ошибка: ' + e.message);
        }
    }

    function logout() {
        removeToken();
        window.location.href = '/login.html';
    }

    window.onload = function() {
        document.getElementById('userGreeting').textContent = 'Пользователь';
        loadVideoList();
    };
</script>
</body>
</html>
