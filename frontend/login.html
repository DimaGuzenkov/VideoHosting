<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеосервис - Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <h1 class="text-center mb-4"><i class="bi bi-play-circle"></i> Видеосервис</h1>

            <!-- Карточка входа -->
            <div class="card mb-4">
                <div class="card-header"><i class="bi bi-box-arrow-in-right"></i> Вход</div>
                <div class="card-body">
                    <div class="mb-3">
                        <input id="loginUsername" class="form-control" placeholder="Имя пользователя">
                    </div>
                    <div class="mb-3">
                        <input id="loginPassword" class="form-control" type="password" placeholder="Пароль">
                    </div>
                    <button onclick="login()" class="btn btn-primary w-100"><i class="bi bi-key"></i> Войти</button>
                    <div id="loginMessage" class="mt-2 text-center text-danger"></div>
                </div>
            </div>

            <!-- Карточка регистрации -->
            <div class="card">
                <div class="card-header"><i class="bi bi-person-plus"></i> Регистрация</div>
                <div class="card-body">
                    <div class="mb-3">
                        <input id="regUsername" class="form-control" placeholder="Имя пользователя">
                    </div>
                    <div class="mb-3">
                        <input id="regEmail" class="form-control" placeholder="Email">
                    </div>
                    <div class="mb-3">
                        <input id="regPassword" class="form-control" type="password" placeholder="Пароль (минимум 6 символов)">
                    </div>
                    <button onclick="register()" class="btn btn-primary w-100"><i class="bi bi-person-add"></i> Зарегистрироваться</button>
                    <div id="regMessage" class="mt-2 text-center text-danger"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="./js/common.js"></script>
<script src="./js/login.js"></script>
</body>
</html>
