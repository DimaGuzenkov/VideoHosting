# Server
server.port=8080

# Spring
spring.application.name=api-gateway

# Cloud Gateway Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[1].id=upload-service
spring.cloud.gateway.routes[1].uri=http://upload-service:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/videos/upload
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[1].filters[1]=JwtAuthFilter

spring.cloud.gateway.routes[2].id=stream-service
spring.cloud.gateway.routes[2].uri=http://stream-service:8080
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/videos/**,/api/stream/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[3].id=frontend
spring.cloud.gateway.routes[3].uri=http://localhost:80
spring.cloud.gateway.routes[3].predicates[0]=Path=/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0

# JWT
jwt.secret=mySecretKeyForJwtGenerationShouldBeAtLeast32Chars

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.example.gateway=DEBUG