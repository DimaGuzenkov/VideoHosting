# ==============================================================================
# Server
# ==============================================================================
server.port=8080
spring.application.name=api-gateway

# ==============================================================================
# Swagger Static ? ?????? ??? Gateway, ?? ??????????
# ==============================================================================
spring.cloud.gateway.routes[0].id=swagger-ui-static
spring.cloud.gateway.routes[0].uri=no://op
spring.cloud.gateway.routes[0].order=-100
spring.cloud.gateway.routes[0].predicates[0]=Path=/swagger-ui/**,/swagger-ui.html,/webjars/**

# ==============================================================================
# API Docs ? ???????????? ?? ???????
# ==============================================================================

# auth-service
spring.cloud.gateway.routes[1].id=api-docs-auth
spring.cloud.gateway.routes[1].uri=http://auth-service:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/v3/api-docs/auth-service
spring.cloud.gateway.routes[1].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.routes[1].filters[1]=SetResponseHeader=Content-Type, application/json

# upload-service
spring.cloud.gateway.routes[2].id=api-docs-upload
spring.cloud.gateway.routes[2].uri=http://upload-service:8080
spring.cloud.gateway.routes[2].predicates[0]=Path=/v3/api-docs/upload-service
spring.cloud.gateway.routes[2].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.routes[2].filters[1]=SetResponseHeader=Content-Type, application/json

# stream-service
spring.cloud.gateway.routes[3].id=api-docs-stream
spring.cloud.gateway.routes[3].uri=http://stream-service:8080
spring.cloud.gateway.routes[3].predicates[0]=Path=/v3/api-docs/stream-service
spring.cloud.gateway.routes[3].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.routes[3].filters[1]=SetResponseHeader=Content-Type, application/json

# notification-service
spring.cloud.gateway.routes[4].id=api-docs-notification
spring.cloud.gateway.routes[4].uri=http://notification-service:8080
spring.cloud.gateway.routes[4].predicates[0]=Path=/v3/api-docs/notification-service
spring.cloud.gateway.routes[4].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.routes[4].filters[1]=SetResponseHeader=Content-Type, application/json

# ==============================================================================
# API ? ??????? ??????
# ==============================================================================

# Auth
spring.cloud.gateway.routes[5].id=auth-api
spring.cloud.gateway.routes[5].uri=http://auth-service:8080
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/auth/**

# Upload ? upload/init, upload/complete, upload/abort (POST)
spring.cloud.gateway.routes[6].id=upload-api-post
spring.cloud.gateway.routes[6].uri=http://upload-service:8080
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/videos/upload/**
spring.cloud.gateway.routes[6].predicates[1]=Method=POST

# Upload ? DELETE /api/videos/{id}
spring.cloud.gateway.routes[7].id=upload-api-delete
spring.cloud.gateway.routes[7].uri=http://upload-service:8080
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/videos/**
spring.cloud.gateway.routes[7].predicates[1]=Method=DELETE

# Notification ? SSE
spring.cloud.gateway.routes[8].id=notification-api
spring.cloud.gateway.routes[8].uri=http://notification-service:8080
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/events

# Stream ? list, playlist-url, view
spring.cloud.gateway.routes[9].id=stream-api
spring.cloud.gateway.routes[9].uri=http://stream-service:8080
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/videos/**,/api/stream/**,/internal/**

# ==============================================================================
# Frontend ? ?????? ????????? (catch-all)
# ==============================================================================
spring.cloud.gateway.routes[10].id=frontend
spring.cloud.gateway.routes[10].uri=http://frontend:80
spring.cloud.gateway.routes[10].predicates[0]=Path=/**

# ==============================================================================
# JWT
# ==============================================================================
jwt.secret=${JWT_SECRET}

# ==============================================================================
# Logging
# ==============================================================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.example.gateway=DEBUG

# ==============================================================================
# Management / Metrics
# ==============================================================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.enable.hikaricp=true

# ==============================================================================
# SpringDoc / Swagger
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# application.properties Gateway
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=http://localhost:8081/v3/api-docs

springdoc.swagger-ui.urls[1].name=Upload Service
springdoc.swagger-ui.urls[1].url=http://localhost:8082/v3/api-docs

springdoc.swagger-ui.urls[2].name=Stream Service
springdoc.swagger-ui.urls[2].url=http://localhost:8083/v3/api-docs

springdoc.swagger-ui.urls[3].name=Notification Service
springdoc.swagger-ui.urls[3].url=http://localhost:8084/v3/api-docs

# Tomcat threads
server.tomcat.threads.max=800
server.tomcat.threads.min-spare=100

# Tomcat connections
server.tomcat.accept-count=2000
server.tomcat.max-connections=5000