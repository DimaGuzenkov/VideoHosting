  processor-fast:
    build: ./processor-service
    container_name: processor-fast
    ports: [ "8084:8080" ]
    depends_on:
      postgres-processor: { condition: service_healthy }
      kafka: { condition: service_started }
      minio: { condition: service_started }
      schema-registry: { condition: service_started }
    env_file:
      - env/.env.common
      - env/.env.processor-common
      - env/.env.processor-fast
      - env/.env.event
    volumes:
      - ./processor-service/target/processor-service-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]
    restart: unless-stopped

  processor-slow:
    build: ./processor-service
    container_name: processor-slow
    ports: [ "8089:8080" ]
    depends_on:
      postgres-processor: { condition: service_healthy }
      kafka: { condition: service_started }
      minio: { condition: service_started }
      schema-registry: { condition: service_started }
    env_file:
      - env/.env.common
      - env/.env.processor-common
      - env/.env.processor-slow
      - env/.env.event
    volumes:
      - ./processor-service/target/processor-service-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]
    restart: unless-stopped

  notification-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: notification-service
    ports:
      - "8088:8080"
    env_file:
      - env/.env.common
      - env/.env.event
    depends_on:
      kafka:
        condition: service_started
      schema-registry:
        condition: service_started
    volumes:
      - ./notification-service/target/notification-service-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]
