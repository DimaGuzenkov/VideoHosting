version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: video-postgres
    environment:
      POSTGRES_DB: videodb
      POSTGRES_USER: video_user
      POSTGRES_PASSWORD: video_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_user -d videodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: video-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: video-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: video-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092   # <--- исправлено
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  auth-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: auth-service
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/videodb
      SPRING_DATASOURCE_USERNAME: video_user
      SPRING_DATASOURCE_PASSWORD: video_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: mySecretKeyForJwtGenerationShouldBeAtLeast32Chars
      SERVER_PORT: 8080
    volumes:
      - ./auth-service/target/auth-service-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]
    restart: unless-stopped

  api-gateway:
    image: eclipse-temurin:17-jre-alpine
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES[0].ID: auth-service
      SPRING_CLOUD_GATEWAY_ROUTES[0].URI: http://auth-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES[0].PREDICATES[0]: Path=/api/auth/**
      SPRING_CLOUD_GATEWAY_ROUTES[1].ID: upload-service
      SPRING_CLOUD_GATEWAY_ROUTES[1].URI: http://upload-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES[1].PREDICATES[0]: Path=/api/videos/upload

      SPRING_CLOUD_GATEWAY_ROUTES[2].ID: stream-service
      SPRING_CLOUD_GATEWAY_ROUTES[2].URI: http://stream-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES[2].PREDICATES[0]: Path=/api/videos/**,/api/stream/**,/internal/**

      SPRING_CLOUD_GATEWAY_ROUTES[3].ID: frontend
      SPRING_CLOUD_GATEWAY_ROUTES[3].URI: http://frontend:80
      SPRING_CLOUD_GATEWAY_ROUTES[3].PREDICATES[0]: Path=/**
      JWT_SECRET: mySecretKeyForJwtGenerationShouldBeAtLeast32Chars
      SERVER_PORT: 8080
    volumes:
      - ./api-gateway/target/api-gateway-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: video/frontend:latest
    container_name: frontend
    ports:
      - "8083:80"
    restart: unless-stopped

  upload-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: upload-service
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - minio
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/videodb
      SPRING_DATASOURCE_USERNAME: video_user
      SPRING_DATASOURCE_PASSWORD: video_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      SERVER_PORT: 8080
    volumes:
      - ./upload-service/target/upload-service-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]

  stream-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: stream-service
    ports:
      - "8086:8080"
    depends_on:
      - postgres
      - minio
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/videodb
      SPRING_DATASOURCE_USERNAME: video_user
      SPRING_DATASOURCE_PASSWORD: video_pass
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      SERVER_PORT: 8080
    volumes:
      - ./stream-service/target/stream-service-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]

  processor-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: processor-service
    ports:
      - "8084:8080"
    depends_on:
      - kafka
      - minio
      - stream-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      STREAM_SERVICE_URL: http://stream-service:8080
      SERVER_PORT: 8080
    volumes:
      - ./processor-service/target/processor-service-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      - kafka

volumes:
  postgres_data:
  minio_data:
  redis_data:
  kafka_data:
