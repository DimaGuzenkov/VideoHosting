include:
  - compose-infra.yml
  - compose-services.yml
  - compose-observability.yml

  api-gateway:
    image: eclipse-temurin:17-jre-alpine
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
    environment:
      JWT_SECRET: mySecretKeyForJwtGenerationShouldBeAtLeast32Chars
      SERVER_PORT: 8080
    volumes:
      - ./api-gateway/target/api-gateway-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: video/frontend:latest
    container_name: frontend
    ports:
      - "8083:80"
    restart: unless-stopped

  upload-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: upload-service
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - minio
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/videodb
      SPRING_DATASOURCE_USERNAME: video_user
      SPRING_DATASOURCE_PASSWORD: video_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MINIO_ENDPOINT: http://minio:9000
      SERVER_PORT: 8080
    volumes:
      - ./upload-service/target/upload-service-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]

  stream-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: stream-service
    ports:
      - "8086:8080"
    depends_on:
      - postgres
      - minio
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/videodb
      SPRING_DATASOURCE_USERNAME: video_user
      SPRING_DATASOURCE_PASSWORD: video_pass
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      SERVER_PORT: 8080
    volumes:
      - ./stream-service/target/stream-service-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]

  processor-service:
    build: ./processor-service
    container_name: processor-service
    ports:
      - "8084:8080"
    depends_on:
      - kafka
      - minio
      - schema-registry
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      SPRING_KAFKA_CONSUMER_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SERVER_PORT: 8080
    volumes:
      - ./processor-service/target/processor-service-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: schema-registry
    ports:
      - "8087:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      - kafka

  k6:
    image: grafana/k6:latest
    container_name: k6-load-tester
    volumes:
      - ./k6-scripts:/scripts
      - ./k6-results:/results
    command: run /scripts/test.js
    profiles:
      - load-testing
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  minio_data:
  redis_data:
  kafka_data:
