version: '3.8'

services:
  app:
    image: aemdesign/java-ffmpeg:jdk17   # или t2yazilim/eclipse-temurin:17-jre-alpine_ffmpeg
    container_name: video-app
    ports:
      - "8080:8080"
    volumes:
      - ./target/video-service-0.0.1-SNAPSHOT.jar:/app/app.jar
    command: java -jar /app/app.jar
    depends_on:
      - postgres
      - minio
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/videodb
      SPRING_DATASOURCE_USERNAME: video_user
      SPRING_DATASOURCE_PASSWORD: video_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

  postgres:
    image: postgres:16-alpine
    container_name: video-postgres
    environment:
      POSTGRES_DB: videodb
      POSTGRES_USER: video_user
      POSTGRES_PASSWORD: video_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_user -d videodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: video-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: video-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: video-kafka
    ports:
      - "9092:9092"
    environment:
      # Режим KRaft: брокер + контроллер в одном процессе
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Формат хранения логов (для KRaft)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Отключаем неиспользуемые протоколы (для упрощения)
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 --timeout 5 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  auth-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: auth-service
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/videodb
      SPRING_DATASOURCE_USERNAME: video_user
      SPRING_DATASOURCE_PASSWORD: video_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: mySecretKeyForJwtGenerationShouldBeAtLeast32Chars
      SERVER_PORT: 8080
    volumes:
      - ./auth-service/target/auth-service-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]
    restart: unless-stopped

  api-gateway:
    image: eclipse-temurin:17-jre-alpine
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES[0].ID: auth-service
      SPRING_CLOUD_GATEWAY_ROUTES[0].URI: http://auth-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES[0].PREDICATES[0]: Path=/auth/**
      SPRING_CLOUD_GATEWAY_ROUTES[1].ID: monolith
      SPRING_CLOUD_GATEWAY_ROUTES[1].URI: http://host.docker.internal:8082
      SPRING_CLOUD_GATEWAY_ROUTES[1].PREDICATES[0]: Path=/**
      JWT_SECRET: mySecretKeyForJwtGenerationShouldBeAtLeast32Chars
      SERVER_PORT: 8080
    volumes:
      - ./api-gateway/target/api-gateway-0.0.1-SNAPSHOT.jar:/app.jar
    command: [ "java", "-jar", "/app.jar" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
  kafka_data:
